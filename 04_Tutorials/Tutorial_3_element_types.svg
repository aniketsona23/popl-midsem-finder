<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <style>
    .box   { fill:#f7f9fc; stroke:#2c3e50; stroke-width:1.6; }
    .abs   { fill:#fff6e0; stroke:#8a5a00; stroke-width:1.8; }
    .store { fill:#e9f7ef; stroke:#1e6b3c; stroke-width:1.8; }
    .sep   { stroke:#2c3e50; stroke-width:1; }
    .t     { font-weight:700; font-size:14px; fill:#1b2733; }
    .ti    { font-weight:700; font-size:14px; font-style:italic; fill:#5c3b00; }
    .m     { fill:#1b2733; font-size:12px; font-family:Consolas, 'Courier New', monospace; }
    .n     { fill:#44546a; font-size:12px; font-style:italic; }
    .line  { stroke:#2c3e50; stroke-width:1.6; fill:none; }
    .tri   { fill:#ffffff; stroke:#2c3e50; stroke-width:1.6; }
    .title { font-size:16px; font-weight:700; fill:#1b2733; }
  </style>
  <text x="380" y="18" text-anchor="middle" class="title">Element types: one List&lt;T&gt;, many element types</text>

  <!-- Shape -->
  <rect class="abs" x="40" y="36" width="230" height="84" rx="4"/>
  <text x="155" y="55" text-anchor="middle" class="ti">«abstract»  Shape</text>
  <line class="sep" x1="40" y1="63" x2="270" y2="63"/>
  <text class="m" x="50" y="82">+ area() const : double = 0</text>
  <text class="m" x="50" y="98">+ name() const : const char* = 0</text>
  <text class="m" x="50" y="114">+ virtual ~Shape()</text>

  <!-- inheritance -->
  <polygon class="tri" points="155,120 146,138 164,138"/>
  <line class="line" x1="155" y1="138" x2="155" y2="170"/>
  <line class="line" x1="90" y1="170" x2="290" y2="170"/>
  <line class="line" x1="90" y1="170" x2="90" y2="196"/>
  <line class="line" x1="290" y1="170" x2="290" y2="196"/>

  <rect class="box" x="20" y="196" width="140" height="64" rx="4"/>
  <text x="90" y="215" text-anchor="middle" class="t">Circle</text>
  <line class="sep" x1="20" y1="223" x2="160" y2="223"/>
  <text class="m" x="30" y="242">- r : double</text>
  <text class="m" x="30" y="255">+ area() = πr²</text>

  <rect class="box" x="150" y="196" width="140" height="64" rx="4" transform="translate(70,0)"/>
  <text x="290" y="215" text-anchor="middle" class="t">Rect</text>
  <line class="sep" x1="220" y1="223" x2="360" y2="223"/>
  <text class="m" x="230" y="242">- w, h : double</text>
  <text class="m" x="230" y="255">+ area() = w·h</text>

  <!-- List<ShapePtr> -->
  <rect class="store" x="440" y="70" width="300" height="130" rx="4"/>
  <text x="590" y="90" text-anchor="middle" class="t">List&lt;shared_ptr&lt;Shape&gt;&gt;</text>
  <line class="sep" x1="440" y1="98" x2="740" y2="98"/>
  <text class="n" x="450" y="115">same class template, T = ShapePtr</text>
  <text class="m" x="450" y="136">pushBack(ShapePtr(new Circle(1)))</text>
  <text class="m" x="450" y="152">pushBack(ShapePtr(new Rect(2,5)))</text>
  <text class="m" x="450" y="168">sort([](a,b){ return a-&gt;area()</text>
  <text class="m" x="450" y="184">                   &lt; b-&gt;area(); })</text>

  <!-- association: list holds Shape handles -->
  <line class="line" x1="440" y1="135" x2="272" y2="95"/>
  <polyline class="line" points="284,88 272,95 283,104"/>
  <text x="330" y="100" class="n">holds 0..*</text>
  <text x="300" y="282" class="n">area() is chosen at run time (vtbl) for each element</text>

  <text x="40" y="318" class="n">List&lt;int&gt;, List&lt;std::string&gt;, List&lt;ShapePtr&gt; are all instances of the one template List&lt;T&gt; – the list type is unchanged.</text>
</svg>
